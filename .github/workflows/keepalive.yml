name: Supabase Keepalive

# 免费版 Supabase 连续 7 天没有请求会被暂停，暂停后第一次访问要等冷启动。
# 这个工作流每天发一次请求，让项目保持清醒。
#
# 需要仓库 Settings → Secrets and variables → Actions 里配一个：
#   SUPABASE_URL = https://你的项目ref.supabase.co
# 没配的话会直接跳过，不会报红。

on:
  schedule:
    # 每天 UTC 03:17（北京时间 11:17，避开整点的调度高峰）
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "未配置 SUPABASE_URL，跳过保活（站点还没启用云同步时属正常）"
            exit 0
          fi

          url="${SUPABASE_URL%/}/rest/v1/"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
          echo "GET $url → HTTP $code"

          case "$code" in
            000)
              echo "请求没发出去，检查 SUPABASE_URL 是否正确"
              exit 1
              ;;
            401|403|404|200)
              echo "项目在线（$code 说明服务器已响应，足够保活）"
              ;;
            *)
              echo "返回 $code，项目应该是醒着的"
              ;;
          esac
